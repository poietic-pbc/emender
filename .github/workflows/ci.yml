name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Python smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install package
        run: uv sync --locked --extra dev --extra eval
      - name: Syntax check
        run: |
          uv run python -m py_compile train.py scripts/*.py scripts/conformance/*.py ndm/native_lean_conformance.py ndm/triton/*.py ndm/models/e88_fused.py ndm/models/e88_fla_hybrid.py ndm/models/m2rnn_baseline.py ndm/models/mamba2_baseline.py ndm/models/fla_gated_delta.py
      - name: Unit smoke
        run: uv run python -m pytest tests -m "not gpu"

  typst:
    name: Typst paper build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version
      - name: Build paper
        run: |
          PDF=$(bash paper/build.sh)
          echo "PDF: $PDF"
          test -f "$PDF"

  lean:
    name: Lean trusted core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          build: true
          test: false
      - name: Check trusted proof boundary
        working-directory: formal/lean
        run: |
          scripts/check_paper_core.sh
          scripts/check_trusted_no_placeholders.sh ElmanProofs.lean

  resilient-lean:
    name: Lean resilient coordination
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache exact project-local Lean toolchain
        uses: actions/cache@v4
        with:
          path: formal/resilient/.cache/resilient-lean
          key: lean-4.26.0-linux-873c252b1c6b1392e5720ad8d5a137aabbe72c9f96a930fdb5a1dd1ddc5da454
      - name: Pinned build, theorem hygiene, proofs, and permanent corpus
        working-directory: formal/resilient
        run: scripts/smoke.sh

  native-lean-conformance:
    name: Native service / Lean differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install package and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libfabric-dev libssl-dev pkg-config
          uv sync --locked --extra dev
      - name: Cache exact project-local Lean toolchain
        uses: actions/cache@v4
        with:
          path: formal/resilient/.cache/resilient-lean
          key: lean-4.26.0-linux-873c252b1c6b1392e5720ad8d5a137aabbe72c9f96a930fdb5a1dd1ddc5da454
      - name: Build Lean oracle and native production service
        run: |
          formal/resilient/scripts/lake.sh build resilient-conformance resilient-conformance-corpus
          cmake -S native -B build/native-resilient-dataplane-build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/native-resilient-dataplane" \
            -DNDP_ENABLE_XPMEM=OFF -DNDP_BUILD_TESTS=ON
          cmake --build build/native-resilient-dataplane-build --parallel 4
          ctest --test-dir build/native-resilient-dataplane-build --output-on-failure
          cmake --install build/native-resilient-dataplane-build
          uv run python scripts/frontier/attest_native_dataplane.py record-build \
            --prefix build/native-resilient-dataplane \
            --source-root "$PWD" \
            --cmake-cache build/native-resilient-dataplane-build/CMakeCache.txt
      - name: Replay permanent corpus and prove fault detection
        run: |
          EMENDER_NDP_BUILD_MANIFEST="$PWD/build/native-resilient-dataplane/native-artifacts.json" \
          EMENDER_LEAN_CONFORMANCE_RUNNER="$PWD/formal/resilient/.lake/build/bin/resilient-conformance" \
            uv run python -m pytest -q \
              tests/test_native_lean_conformance.py \
              tests/test_formal_coordination_scale_gate.py
          uv run python scripts/conformance/generate_native_lean_manifest.py \
            --build-manifest "$PWD/build/native-resilient-dataplane/native-artifacts.json" \
            --lean-runner "$PWD/formal/resilient/.lake/build/bin/resilient-conformance" \
            --output /tmp/emender-native-lean-manifest.json \
            --job-5105811-output /tmp/emender-job-5105811-agreement.json
      - name: Bounded deterministic native schedules
        run: |
          ctest --test-dir build/native-resilient-dataplane-build \
            --output-on-failure \
            -R '^ndp_coordination_schedule_stress_test$'
